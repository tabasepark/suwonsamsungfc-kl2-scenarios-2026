<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>수원 삼성 블루윙즈 승격·우승 경우의 수</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4FA; --surface:#FFFFFF; --ink:#0E1B3D; --muted:#56627F; --line:#D9E0EE;
  --blue:#0B3FA8; --blue-soft:#E2EBFF; --hero:#0A2A73; --dock-bg:rgba(255,255,255,.94);
  --ok:#087050; --ok-soft:#DAF3E8;
  --po:#A64B06; --po-soft:#FFE6D1;
  --na:#5F6778; --na-soft:#E8EBF1;
  --open:#2A56C4; --open-soft:#E3ECFF;
  --tie:#6A3C9E; --tie-soft:#EDE3F8;
  --err:#B3261E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1020; --surface:#141B33; --ink:#E8ECF8; --muted:#9AA6C6; --line:#27324F;
    --blue:#7FA6FF; --blue-soft:#1B2B58; --hero:#0F2C74; --dock-bg:rgba(16,22,42,.94);
    --ok:#52D6A0; --ok-soft:#123A2D;
    --po:#FFB26B; --po-soft:#3E2A14;
    --na:#A3ABBE; --na-soft:#232B40;
    --open:#8FB0FF; --open-soft:#1B2B58;
    --tie:#C7A6F2; --tie-soft:#32224A;
    --err:#FF8A80;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#141B33; --ink:#E8ECF8; --muted:#9AA6C6; --line:#27324F;
  --blue:#7FA6FF; --blue-soft:#1B2B58; --hero:#0F2C74; --dock-bg:rgba(16,22,42,.94);
  --ok:#52D6A0; --ok-soft:#123A2D;
  --po:#FFB26B; --po-soft:#3E2A14;
  --na:#A3ABBE; --na-soft:#232B40;
  --open:#8FB0FF; --open-soft:#1B2B58;
  --tie:#C7A6F2; --tie-soft:#32224A;
  --err:#FF8A80;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  font-size:15px;line-height:1.55;padding-bottom:220px;
  word-break:keep-all;overflow-wrap:anywhere;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 0}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--hero);color:#fff;border-radius:22px;padding:20px 18px 16px}
.pitch{position:absolute;right:-60px;top:-40px;width:260px;height:260px;opacity:.12;pointer-events:none}
.hero h1{position:relative;font-family:'Do Hyeon','Noto Sans KR',sans-serif;font-weight:400;font-size:25px;line-height:1.25;margin:0 0 4px}
.asof{position:relative;margin:0;font-size:12.5px;opacity:.8}
.cards{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.mcard{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px 14px 12px}
.mlabel{font-size:13px;opacity:.9}
.mnum{font-family:'Do Hyeon','Noto Sans KR',sans-serif;font-size:58px;line-height:1.05;margin-top:2px}
.mnum small{font-family:'Noto Sans KR',sans-serif;font-size:17px;margin-left:3px;font-weight:500}
.mnum.word{font-size:34px;line-height:1.5;padding-top:8px}
.msub{font-size:12px;opacity:.78;margin-top:4px}
.herostat{position:relative;margin:14px 0 0;font-size:13px;opacity:.9}

/* sections */
.block{margin-top:26px}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.block h2{font-family:'Do Hyeon','Noto Sans KR',sans-serif;font-weight:400;font-size:21px;margin:0}
.lead{margin:2px 0 14px;color:var(--muted);font-size:13.5px}
.linkbtn{appearance:none;background:none;border:0;color:var(--blue);font-size:13px;padding:6px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* path */
.step{display:grid;grid-template-columns:24px 1fr;gap:8px}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:11px;top:0;bottom:-14px;width:2px;background:var(--line)}
.step.last .rail::before{bottom:auto;height:22px}
.dot{position:absolute;left:4px;top:18px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--blue)}
.step.done .dot{background:var(--blue)}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:14px}
.smeta{font-size:12.5px;color:var(--muted)}
.svs{font-size:16px;font-weight:700;margin-top:1px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.opt{appearance:none;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 4px;min-height:92px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
.opt .res{font-family:'Do Hyeon','Noto Sans KR',sans-serif;font-size:24px;line-height:1}
.opt.on{border-color:var(--blue);background:var(--blue-soft)}
.chips{display:flex;flex-direction:column;gap:4px;align-items:center}
.chip{display:block;font-style:normal;font-size:11px;font-weight:500;line-height:1;padding:5px 7px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.po{background:var(--po-soft);color:var(--po)}
.chip.na{background:var(--na-soft);color:var(--na)}
.chip.open{background:var(--open-soft);color:var(--open)}
.chip.tie{background:var(--tie-soft);color:var(--tie)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--na-soft);color:var(--na);margin-right:6px}
.tag.win{background:var(--ok-soft);color:var(--ok)}
.tag.loss{background:var(--po-soft);color:var(--po)}
.final{background:var(--blue-soft);border:1px solid var(--blue);border-radius:16px;padding:12px 14px;margin-bottom:6px}
.final b{font-size:15px}
.final p{margin:4px 0 8px;font-size:13px;color:var(--muted)}
.final .chips{flex-direction:row;justify-content:flex-start;gap:6px}

/* editor */
.aed{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.aed .vs{font-size:13px;color:var(--muted)}
input.num{width:58px;height:40px;text-align:center;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.btn{appearance:none;border:1.5px solid var(--blue);background:var(--blue);color:#fff;border-radius:10px;height:40px;padding:0 14px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--blue)}
:root[data-theme="dark"] .btn{color:#0B1020}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0B1020}}
.err{color:var(--err);font-size:12.5px;margin-top:4px}

/* rivals */
.team{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.th{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.th b{font-size:16px}
.th span{font-size:12.5px;color:var(--muted)}
.mrow{padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{margin-top:8px}
.mtop{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.mtxt{font-size:14px}
.mtxt small{display:block;color:var(--muted);font-size:12px}
.seg{display:grid;grid-template-columns:repeat(3,52px);gap:6px}
.seg button{appearance:none;height:40px;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .seg button.on{color:#0B1020}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{color:#0B1020}}

/* tie panel */
.tiebox{background:var(--tie-soft);border:1px solid var(--tie);border-radius:16px;padding:12px 14px}
.tiebox h3{margin:0 0 4px;font-size:15px}
.tiebox p{margin:0 0 8px;font-size:13px}
.srow{padding:8px 0;border-top:1px solid var(--line)}
.srow .lbl{font-size:13px}
.verdict{font-weight:700;margin:8px 0 4px}
.tiebox input.num{border-color:var(--tie);background:var(--surface)}


/* timeline */
.grp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px 4px;margin-bottom:12px}
.grp.cur{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.gh{display:flex;align-items:center;gap:8px;padding-bottom:6px}
.gh b{font-size:15px}
.now{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--blue);color:#fff}
:root[data-theme="dark"] .now{color:#0B1020}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .now{color:#0B1020}}
.assume{font-size:12.5px;color:var(--muted)}
.rec{margin-top:8px}
.btn.small{height:36px;padding:0 12px;font-size:14px}
.code{flex:1 1 180px;min-width:0;height:40px;font:inherit;font-size:13px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.msg{font-size:13px;margin:6px 0 0;color:var(--muted)}
.mrow:first-of-type{margin-top:0}
.mrow.mine{background:var(--blue-soft);border-top-color:transparent;border-left:4px solid var(--blue);border-radius:10px;padding:10px 8px 10px 10px;margin:6px 0}
.box{display:inline-block;border:1.5px solid var(--blue);border-radius:6px;padding:0 7px;color:var(--blue);background:var(--surface);font-weight:700;line-height:1.5}
.box.fill{background:var(--blue);color:#fff}
:root[data-theme="dark"] .box.fill{color:#0B1020}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .box.fill{color:#0B1020}}
.seg.s{grid-template-columns:repeat(3,60px)}
.seg.s button{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;line-height:1.1}
.seg.s .sub{font-size:10.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg.s .sub.ok{color:var(--ok);font-weight:700}
.seg.s .sub.po{color:var(--po);font-weight:700}
.seg.s button.on .sub{color:inherit}
.seg button:disabled{cursor:not-allowed;border-style:dashed;background:transparent}
.seg button:disabled .r{color:var(--muted)}

/* notes */
.notes{margin:26px 0 8px;padding:14px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:12.5px}
.notes ul{margin:0;padding-left:18px}
.notes li{margin:3px 0}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--dock-bg);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.dock-in{max-width:560px;margin:0 auto}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dverd{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dtog{appearance:none;border:0;background:none;color:var(--muted);font-size:12.5px;padding:6px 0 6px 8px;cursor:pointer}
.trow{display:grid;grid-template-columns:22px 1fr 34px 40px 46px;align-items:center;gap:4px;padding:5px 6px 5px 8px;border-left:4px solid var(--ok);margin-top:4px;background:var(--surface);border-radius:6px;font-size:13.5px}
.trow.po{border-left-color:var(--po)}
.trow.hd{background:none;border-left-color:transparent;color:var(--muted);font-size:11.5px;padding-top:0;padding-bottom:0}
.trow .n{text-align:right;font-variant-numeric:tabular-nums}
.trow .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .p{font-weight:700}
.legend{font-size:11.5px;color:var(--muted);margin:6px 0 0 8px}
.eq{font-size:10.5px;color:var(--tie);margin-left:4px;font-weight:500}
@media (prefers-reduced-motion: no-preference){
  .opt,.seg button{transition:background .15s,border-color .15s}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero" id="hero"></header>
  <section class="block" id="plan"></section>
  <section class="block" id="tie" hidden></section>
  <footer class="notes" id="notes"></footer>
</div>
<aside class="dock" id="dock" aria-label="순위 요약"></aside>

<script>
(function(){
'use strict';

/* ───────── 데이터 (11/1(일) 수원FC–안산전 종료 기준) ───────── */
var AS_OF = '11/1(일)';
var ORDER = ['SUW','SFC','SEL','DAE'];
var TEAM = {
  SUW:{name:'수원', short:'수원'},
  SFC:{name:'수원FC', short:'수원FC'},
  SEL:{name:'서울 이랜드', short:'서울'},
  DAE:{name:'대구FC', short:'대구FC'}
};
var BASE = {
  SUW:{p:63,w:19,d:6,l:4,gf:50,ga:25},
  SFC:{p:57,w:16,d:9,l:4,gf:54,ga:31},
  SEL:{p:54,w:16,d:6,l:7,gf:54,ga:36},
  DAE:{p:53,w:15,d:8,l:6,gf:57,ga:40}
};
/* day: 정렬용 날짜, sort: 같은 날 정렬용 시각(표시 안 함), time: 화면에 표시할 시각(공식 확인된 것만) */
var MATCHES = [
  {id:'F1',t:'SFC',rd:32,day:1107,date:'11/7(토)', time:'14:00',sort:'14:00',opp:'경남FC',venue:'수원종합운동장',home:true},
  {id:'D1',t:'DAE',rd:32,day:1107,date:'11/7(토)', time:'14:00',sort:'14:00',opp:'성남FC',venue:'탄천종합운동장',home:false},
  {id:'E1',t:'SEL',rd:32,day:1107,date:'11/7(토)', time:'16:30',sort:'16:30',opp:'전남',venue:'목동종합운동장',home:true},
  {id:'S1',t:'SUW',rd:32,day:1108,date:'11/8(일)', time:'14:00',sort:'14:00',opp:'용인FC',venue:'수원월드컵경기장',home:true},
  {id:'S2',t:'SUW',rd:33,day:1121,date:'11/21(토)',time:'14:00', sort:'14:00',opp:'경남FC',venue:'수원월드컵경기장',home:true},
  {id:'F2',t:'SFC',rd:33,day:1121,date:'11/21(토)',time:'16:30', sort:'16:30',opp:'김포FC',venue:'김포솔터축구장',home:false},
  {id:'D2',t:'DAE',rd:33,day:1122,date:'11/22(일)',time:'14:00', sort:'14:00',opp:'김해FC',venue:'대구iM뱅크파크',home:true},
  {id:'E2',t:'SEL',rd:33,day:1122,date:'11/22(일)',time:'16:30', sort:'16:30',opp:'충남아산',venue:'목동종합운동장',home:true},
  {id:'S3',t:'SUW',rd:34,day:1129,date:'11/29(일)',time:'14:00',sort:'14:00',opp:'전남',venue:'순천팔마종합운동장',home:false},
  {id:'F3',t:'SFC',rd:34,day:1129,date:'11/29(일)',time:'14:00',sort:'14:00',opp:'충북청주',venue:'수원종합운동장',home:true},
  {id:'E3',t:'SEL',rd:34,day:1129,date:'11/29(일)',time:'14:00',sort:'14:00',opp:'경남FC',venue:'창원축구센터',home:false},
  {id:'D3',t:'DAE',rd:34,day:1129,date:'11/29(일)',time:'14:00',sort:'14:00',opp:'천안시티',venue:'천안종합운동장',home:false}
];
/* 종료된 경기: 'id': [해당 팀 득점, 실점]. Claude가 결과를 받아 여기에 추가해 다시 게시합니다. */
var PLAYED = {};

/* 시간순 정렬과 날짜별 묶음 */
var CHRON = MATCHES.slice().sort(function(a,b){
  return (a.day-b.day) || (a.sort<b.sort?-1:(a.sort>b.sort?1:0)) || (ORDER.indexOf(a.t)-ORDER.indexOf(b.t));
});
var GROUPS = [];
CHRON.forEach(function(m){
  var g = GROUPS[GROUPS.length-1];
  if(!g || g.day!==m.day){ g = {day:m.day, date:m.date, matches:[]}; GROUPS.push(g); }
  g.matches.push(m);
});

/* ───────── 상태 ───────── */
var KEY = 'suwon-scenarios-v1';
var state = {sel:{}, sc:{}, err:{}, dockOpen:true};
var storeOk = true;
try{
  window.localStorage.setItem(KEY+'-t','1'); window.localStorage.removeItem(KEY+'-t');
  var raw = window.localStorage.getItem(KEY);
  if(raw){
    var o = JSON.parse(raw);
    if(o && typeof o==='object'){
      state.sel = o.sel||{}; state.sc = o.sc||{};
      if(typeof o.dockOpen==='boolean') state.dockOpen = o.dockOpen;
    }
  }
}catch(e){ storeOk = false; }
function save(){
  try{ window.localStorage.setItem(KEY, JSON.stringify({sel:state.sel, sc:state.sc, dockOpen:state.dockOpen})); }catch(e){ storeOk = false; }
}

/* ───────── 유틸 ───────── */
var PTS = [0,1,3];
function dig(a,b){ return a>b?2:(a===b?1:0); }
var RES = ['패','무','승'];
function byId(id){ for(var i=0;i<MATCHES.length;i++){ if(MATCHES[i].id===id) return MATCHES[i]; } return null; }
function playedScore(id){ return PLAYED[id] || null; }
function fixedOf(m){
  var ps = playedScore(m.id);
  if(ps) return {d:dig(ps[0],ps[1]), score:ps, played:true};
  var s = state.sel[m.id];
  if(s!==undefined){
    var sc = state.sc[m.id];
    return {d:s, score:(sc && dig(sc[0],sc[1])===s)?sc:null, played:false};
  }
  return null;
}
function playedOnly(m){
  var ps = playedScore(m.id);
  return ps ? {d:dig(ps[0],ps[1]), score:ps, played:true} : null;
}
function groupIndex(m){ for(var i=0;i<GROUPS.length;i++){ if(GROUPS[i].day===m.day) return i; } return -1; }
function curGroup(){
  for(var i=0;i<GROUPS.length;i++){
    for(var k=0;k<GROUPS[i].matches.length;k++){ if(!playedScore(GROUPS[i].matches[k].id)) return i; }
  }
  return -1;
}
function suwonReady(m){
  var sm = MATCHES.filter(function(x){ return x.t==='SUW' && !playedScore(x.id); }).sort(function(a,b){ return a.rd-b.rd; });
  for(var i=0;i<sm.length;i++){
    if(sm[i].id===m.id) return true;
    if(state.sel[sm[i].id]===undefined) return false;
  }
  return true;
}
function teamStats(tid, inc){
  var b = {p:BASE[tid].p,w:BASE[tid].w,d:BASE[tid].d,l:BASE[tid].l,gf:BASE[tid].gf,ga:BASE[tid].ga};
  var gp = b.w+b.d+b.l, free = [];
  for(var i=0;i<MATCHES.length;i++){
    var m = MATCHES[i]; if(m.t!==tid) continue;
    var f = inc ? fixedOf(m) : playedOnly(m);
    if(!f){ free.push(m); continue; }
    b.p += PTS[f.d];
    if(f.d===2) b.w++; else if(f.d===1) b.d++; else b.l++;
    if(f.score){ b.gf += f.score[0]; b.ga += f.score[1]; }
    gp++;
  }
  b.gp = gp; b.free = free; b.tid = tid;
  return b;
}
function cmpTeams(a,b){
  return (b.p-a.p) || (b.gf-a.gf) || ((b.gf-b.ga)-(a.gf-a.ga)) || (b.w-a.w) || (ORDER.indexOf(a.tid)-ORDER.indexOf(b.tid));
}
function goalsKnown(tid){
  for(var i=0;i<MATCHES.length;i++){
    var m = MATCHES[i]; if(m.t!==tid) continue;
    if(playedScore(m.id)) continue;
    var s = state.sel[m.id], sc = state.sc[m.id];
    if(!(s!==undefined && sc && dig(sc[0],sc[1])===s)) return false;
  }
  return true;
}
function signed(n){ return (n>0?'+':'')+n; }

/* ───────── 경우의 수 계산 ─────────
   수원 + 경쟁 3팀의 남은 경기를 승/무/패로 전부 열거해 수원의 순위 범위를 계산합니다.
   (이 4팀의 남은 상대는 모두 4팀 밖이라 경기들이 서로 독립적입니다)
   승점이 같으면 다득점 → 득실차 → 다승 순으로 비교하되, 두 팀의 남은 경기 스코어가
   모두 입력된 경우에만 확정하고, 아니면 ‘득점 비교 필요’로 분류합니다.
   다승까지 같으면 승자승 이하는 ‘추가 확인 필요’로 남깁니다. */
function teamOptions(tid, cut){
  var b = {p:BASE[tid].p,w:BASE[tid].w,gf:BASE[tid].gf,ga:BASE[tid].ga};
  var un = [];
  for(var i=0;i<MATCHES.length;i++){
    var m = MATCHES[i]; if(m.t!==tid) continue;
    var ps = playedScore(m.id);
    if(ps){
      var d = dig(ps[0],ps[1]);
      b.p += PTS[d]; if(d===2) b.w++; b.gf += ps[0]; b.ga += ps[1];
    } else un.push(m);
  }
  var opts = [{p:b.p,w:b.w,gf:b.gf,ga:b.ga,known:true,digits:[]}];
  for(var j=0;j<un.length;j++){
    var mm = un[j], off = !!(cut && mm.day>cut);
    var sel = off ? undefined : state.sel[mm.id], sc = off ? undefined : state.sc[mm.id];
    var choices = (tid==='SUW' || sel===undefined) ? [0,1,2] : [sel];
    var next = [];
    for(var a=0;a<opts.length;a++){
      for(var c=0;c<choices.length;c++){
        var dd = choices[c], o = opts[a];
        var has = (sel===dd && sc && dig(sc[0],sc[1])===dd);
        next.push({
          p:o.p+PTS[dd], w:o.w+(dd===2?1:0),
          gf:o.gf+(has?sc[0]:0), ga:o.ga+(has?sc[1]:0),
          known:o.known && !!has, digits:o.digits.concat(dd)
        });
      }
    }
    opts = next;
  }
  return {opts:opts, un:un};
}
function rel(S,Y){ /* 1: Y가 수원보다 위, 0: 아래, 2: 판정 불가 */
  if(Y.p>S.p) return 1;
  if(Y.p<S.p) return 0;
  if(!(S.known && Y.known)) return 2;
  if(Y.gf!==S.gf) return Y.gf>S.gf?1:0;
  var gS = S.gf-S.ga, gY = Y.gf-Y.ga;
  if(gY!==gS) return gY>gS?1:0;
  if(Y.w!==S.w) return Y.w>S.w?1:0;
  return 2;
}
function evaluate(cut){
  var so = teamOptions('SUW', cut);
  var o1 = teamOptions('SFC', cut).opts, o2 = teamOptions('SEL', cut).opts, o3 = teamOptions('DAE', cut).opts;
  var masks = [];
  for(var s=0;s<so.opts.length;s++){
    var S = so.opts[s], pm = 0, cm = 0;
    for(var a=0;a<o1.length;a++){
      var r1 = rel(S,o1[a]);
      for(var b=0;b<o2.length;b++){
        var r2 = rel(S,o2[b]);
        for(var c=0;c<o3.length;c++){
          var r3 = rel(S,o3[c]);
          var up = (r1===1?1:0)+(r2===1?1:0)+(r3===1?1:0);
          var un = (r1===2?1:0)+(r2===2?1:0)+(r3===2?1:0);
          var worst = up+un+1, best = up+1;
          pm |= worst<=2 ? 1 : (best>=3 ? 2 : 4);
          cm |= (up===0 && un===0) ? 1 : (up>=1 ? 2 : 4);
        }
      }
    }
    masks.push({pm:pm, cm:cm, digits:S.digits, p:S.p});
  }
  return {un:so.un, masks:masks};
}
function agg(ev, pred){
  var pm = 0, cm = 0;
  for(var i=0;i<ev.masks.length;i++){ if(pred(ev.masks[i].digits)){ pm |= ev.masks[i].pm; cm |= ev.masks[i].cm; } }
  return {pm:pm, cm:cm};
}
function chipOf(kind, mask){
  if(kind==='p'){
    if(mask===1) return ['승격 확정','ok'];
    if(mask===2) return ['플레이오프','po'];
    if(mask===4) return ['승격 득점비교','tie'];
    return ['승격 미정','open'];
  }
  if(mask===1) return ['우승 확정','ok'];
  if(mask===2) return ['우승 불가','na'];
  if(mask===4) return ['우승 득점비교','tie'];
  return ['우승 미정','open'];
}
function chipHTML(kind, mask){ var c = chipOf(kind,mask); return '<i class="chip '+c[1]+'">'+c[0]+'</i>'; }

/* 자력으로 확정되는 승점 (실제 종료된 경기만 반영, 동률은 불리하게 가정) */
function magic(){
  var S = teamStats('SUW', false);
  var maxAdd = 3*S.free.length;
  var others = [];
  for(var i=1;i<ORDER.length;i++){ var st = teamStats(ORDER[i], false); others.push(st.p + 3*st.free.length); }
  function n(x){ var f = S.p + x, k = 0; for(var j=0;j<others.length;j++){ if(others[j]>=f) k++; } return k; }
  var promo = null, champ = null;
  for(var x=0;x<=maxAdd;x++){
    if(promo===null && n(x)<=1) promo = x;
    if(champ===null && n(x)===0) champ = x;
  }
  return {promo:promo, champ:champ, left:S.free.length, max:S.p+maxAdd};
}

function $(id){ return document.getElementById(id); }

  var m = magic();
  var st = ORDER.map(function(t){ return teamStats(t,false); }).sort(cmpTeams);
  var rank = 1; for(var i=0;i<st.length;i++){ if(st[i].tid==='SUW') rank = i+1; }
  var S = teamStats('SUW',false);
  function card(label, v, sub){
    if(v===0) return '<div class="mcard"><div class="mlabel">'+label+'</div><div class="mnum word">확정</div><div class="msub">'+sub+'</div></div>';
    if(v===null) return '<div class="mcard"><div class="mlabel">'+label+'</div><div class="mnum word">자력 불가</div><div class="msub">'+sub+'</div></div>';
    return '<div class="mcard"><div class="mlabel">'+label+'</div><div class="mnum">'+v+'<small>점</small></div><div class="msub">'+sub+'</div></div>';
  }
  $('hero').innerHTML =
    '<svg class="pitch" viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="3"><circle cx="100" cy="100" r="60"/><circle cx="100" cy="100" r="5" fill="#fff"/><line x1="100" y1="0" x2="100" y2="200"/><rect x="-10" y="55" width="50" height="90"/></g></svg>'+
    '<h1>수원 삼성 블루윙즈 승격·우승 경우의 수</h1>'+
    '<p class="asof">'+AS_OF+' 기준 · K리그2 2026 정규리그 34R'+'</p>'+
    '<div class="cards">'+
      card('승격까지', m.promo, '1·2위 자동 승격')+
      card('우승까지', m.champ, '정규리그 1위')+
    '</div>'+
    '<p class="herostat">현재 '+rank+'위 · 승점 '+S.p+' · 남은 '+m.left+'경기 · 최대 '+m.max+'점</p>';
}

var evCache = {};
function evAt(day){ return evCache[day] || (evCache[day] = evaluate(day)); }
function outLabel(r){
  if(r.pm===1 && r.cm===1) return ['우승+승격','ok'];
  if(r.pm===1) return ['승격','ok'];
  if(r.pm===2) return ['플레이오프','po'];
  return ['미정',''];
}
function matchLabel(m){ return m.date + (m.time?' '+m.time:''); }
function nm(m, mine){
  if(mine) return m.t==='SUW' ? '<b class="box fill">수원</b>' : '<b class="box">'+TEAM[m.t].short+'</b>';
  return m.opp;
}
function vsHTML(m){ return m.home ? nm(m,true)+' vs '+nm(m,false) : nm(m,false)+' vs '+nm(m,true); }
function infoLine(m){ return m.rd+'R'+(m.time?' '+m.time:'')+' '+m.venue; }
function scorePair(m, gv, av){
  var tn = TEAM[m.t].short;
  var gi = '<input class="num" type="number" inputmode="numeric" min="0" max="30" aria-label="'+tn+' 득점" data-k="g" value="'+gv+'">';
  var ai = '<input class="num" type="number" inputmode="numeric" min="0" max="30" aria-label="'+m.opp+' 득점" data-k="a" value="'+av+'">';
  return m.home
    ? '<span class="vs">'+tn+'</span>'+gi+'<span>:</span>'+ai+'<span class="vs">'+m.opp+'</span>'
    : '<span class="vs">'+m.opp+'</span>'+ai+'<span>:</span>'+gi+'<span class="vs">'+tn+'</span>';
}
function playedTag(m){
  var ps = playedScore(m.id), d = dig(ps[0],ps[1]);
  var cls = d===2?'win':(d===0?'loss':'');
  var hs = m.home ? ps[0] : ps[1], as = m.home ? ps[1] : ps[0];
  var L = m.home ? nm(m,true) : nm(m,false), R = m.home ? nm(m,false) : nm(m,true);
  return '<span class="tag '+cls+'">종료 · '+RES[d]+'</span>'+L+' '+hs+' : '+as+' '+R;
}

/* 시간순 일정 + 결과 입력 */
function matchRow(m, ev){
  var team = TEAM[m.t].short;
  if(playedScore(m.id)){
    return '<div class="mrow'+(m.t==='SUW'?' mine':'')+'"><div class="mtop"><div class="mtxt">'+playedTag(m)+'<small>'+infoLine(m)+'</small></div></div></div>';
  }
  var isS = (m.t==='SUW'), ready = !isS || suwonReady(m), cur = state.sel[m.id];
  var title = '<div class="mtxt">'+vsHTML(m)+'<small>'+infoLine(m)+'</small></div>';
  var sj = -1, evx = isS ? evAt(m.day) : ev;
  if(isS){ for(var q=0;q<evx.un.length;q++){ if(evx.un[q].id===m.id) sj = q; } }
  var ctl = '<div class="seg'+(isS?' s':'')+'">';
  for(var d=2; d>=0; d--){
    var inner = RES[d];
    if(isS && sj>=0){
      var r = agg(evx, (function(jj,dd){ return function(dg){
        for(var u=0;u<jj;u++){ var sv = state.sel[evx.un[u].id]; if(sv!==undefined && dg[u]!==sv) return false; }
        return dg[jj]===dd;
      }; })(sj,d));
      var ol = outLabel(r);
      inner = '<span class="r">'+RES[d]+'</span><span class="sub '+ol[1]+'">'+ol[0]+'</span>';
    }
    ctl += '<button class="'+(cur===d?'on':'')+'" aria-pressed="'+(cur===d)+'" aria-label="'+team+' '+RES[d]+' 가정" data-act="'+(isS?'selS':'selR')+'" data-id="'+m.id+'" data-d="'+d+'"'+(ready?'':' disabled')+'>'+inner+'</button>';
  }
  ctl += '</div>';
  var note = (isS && !ready) ? '<div class="assume">앞 수원 경기의 가정을 먼저 선택해 주세요.</div>' : '';
  return '<div class="mrow'+(isS?' mine':'')+'"><div class="mtop">'+title+ctl+'</div>'+note+'</div>';
}
function renderPlan(ev){
  var cur = curGroup();
  var html = '<div class="bh"><h2>경기 일정</h2><button class="linkbtn" data-act="reset">가정 초기화</button></div>'+
    '<p class="lead">날짜 순서대로 보여줘요. 아직 안 끝난 경기는 승·무·패를 가정해 볼 수 있어요. 수원 경기는 앞 경기를 가정해야 다음 경기를 고를 수 있고, 버튼 아래 작은 글씨는 그 경기 날짜까지의 선택만 반영한 확정 여부예요. 이후 경기 결과는 모든 경우를 따져요.</p>';
  for(var gi=0; gi<GROUPS.length; gi++){
    var g = GROUPS[gi], isCur = (gi===cur);
    html += '<div class="grp'+(isCur?' cur':'')+'"><div class="gh"><b>'+g.date+'</b>'+(isCur?'<span class="now">다음 경기</span>':'')+'</div>';
    for(var k=0;k<g.matches.length;k++) html += matchRow(g.matches[k], ev);
    html += '</div>';
  }
  $('plan').innerHTML = html;
}

function scoreRows(tid){
  var html = '';
  for(var i=0;i<MATCHES.length;i++){
    var m = MATCHES[i]; if(m.t!==tid || playedScore(m.id)) continue;
    var d = state.sel[m.id]; if(d===undefined) continue;
    var sc = state.sc[m.id];
    var gv = sc?sc[0]:'', av = sc?sc[1]:'';
    html += '<div class="srow" data-sid="'+m.id+'"><div class="lbl">'+vsHTML(m)+' · '+m.date+' ('+TEAM[tid].short+' '+RES[d]+')</div>'+
      '<div class="aed">'+scorePair(m,gv,av)+'</div>'+
      (state.err[m.id]?'<div class="err">'+state.err[m.id]+'</div>':'')+'</div>';
  }
  return html;
}
function renderTie(){
  var S = teamStats('SUW', true);
  var el = $('tie');
  if(S.free.length){ el.hidden = true; el.innerHTML = ''; return; }
  var tied = [];
  for(var i=1;i<ORDER.length;i++){
    var Y0 = teamStats(ORDER[i], true);
    if(Y0.free.length===0 && Y0.p===S.p) tied.push(Y0);
  }
  if(!tied.length){ el.hidden = true; el.innerHTML = ''; return; }
  var html = '<div class="tiebox"><h3>승점 동률 · 득점으로 순위를 가려요</h3>'+
    '<p>수원과 승점이 같은 팀이 있어요. 순위는 다득점, 득실차, 다승 순으로 정해져요. 두 팀의 남은 경기 스코어를 입력하면 판정해 드려요.</p>';
  var sRows = scoreRows('SUW');
  if(sRows) html += '<b>수원</b>'+sRows;
  var kS = goalsKnown('SUW');
  for(var k=0;k<tied.length;k++){
    var Y = tied[k], t = Y.tid;
    html += '<div class="verdict">수원 – '+TEAM[t].short+' · 승점 '+S.p+'점 동률</div>';
    var yRows = scoreRows(t);
    if(yRows) html += yRows;
    if(kS && goalsKnown(t)){
      var msg;
      if(S.gf!==Y.gf) msg = '다득점: 수원 '+S.gf+' / '+TEAM[t].short+' '+Y.gf+' → '+(S.gf>Y.gf?'수원이 앞서요':TEAM[t].short+'가 앞서요');
      else if((S.gf-S.ga)!==(Y.gf-Y.ga)) msg = '다득점 동률 · 득실차: 수원 '+signed(S.gf-S.ga)+' / '+TEAM[t].short+' '+signed(Y.gf-Y.ga)+' → '+((S.gf-S.ga)>(Y.gf-Y.ga)?'수원이 앞서요':TEAM[t].short+'가 앞서요');
      else if(S.w!==Y.w) msg = '득실차까지 동률 · 다승: 수원 '+S.w+' / '+TEAM[t].short+' '+Y.w+' → '+(S.w>Y.w?'수원이 앞서요':TEAM[t].short+'가 앞서요');
      else msg = '다승까지 동률이에요. 승자승 이하는 반영하지 않아요. 추가 확인이 필요해요.';
      html += '<p><b>'+msg+'</b></p>';
    } else {
      html += '<p>두 팀 모두 남은 경기 스코어를 입력하면 결과가 나와요.</p>';
    }
  }
  html += '</div>';
  el.hidden = false; el.innerHTML = html;
}

function renderDock(ev){
  var all = agg(ev, function(dg){
    for(var q=0;q<ev.un.length;q++){ var s = state.sel[ev.un[q].id]; if(s!==undefined && dg[q]!==s) return false; }
    return true;
  });
  var st = ORDER.map(function(t){ return teamStats(t,true); }).sort(cmpTeams);
  var rows = '';
  if(state.dockOpen){
    rows += '<div class="trow hd"><span></span><span>팀</span><span class="n">경기</span><span class="n">승점</span><span class="n">득실</span></div>';
    for(var i=0;i<st.length;i++){
      var y = st[i], eq = false;
      for(var j=0;j<st.length;j++){ if(j!==i && st[j].p===y.p) eq = true; }
      rows += '<div class="trow'+(i>=2?' po':'')+'"><span class="n">'+(i+1)+'</span><span class="t">'+TEAM[y.tid].name+(eq?'<span class="eq">동률</span>':'')+'</span>'+
        '<span class="n">'+y.gp+'</span><span class="n p">'+y.p+'</span><span class="n">'+signed(y.gf-y.ga)+'</span></div>';
    }
    rows += '<div class="legend">초록 막대는 승격, 주황 막대는 플레이오프예요. 선택한 경기까지 반영해요.</div>';
  }
  $('dock').innerHTML = '<div class="dock-in"><div class="dhead"><div class="dverd">'+chipHTML('p',all.pm)+chipHTML('c',all.cm)+'</div>'+
    '<button class="dtog" data-act="dock" aria-expanded="'+state.dockOpen+'">'+(state.dockOpen?'접기':'순위표 보기')+'</button></div>'+rows+'</div>';
  document.body.style.paddingBottom = ($('dock').offsetHeight + 24) + 'px';
}

function render(){
  evCache = {};
  var ev = evaluate();

/* ───────── 조작 ───────── */
function clearAfterSuwon(id){
  var sm = MATCHES.filter(function(m){ return m.t==='SUW' && !playedScore(m.id); }).sort(function(a,b){ return a.rd-b.rd; });
  var hit = false;
  for(var i=0;i<sm.length;i++){
    if(hit){ delete state.sel[sm[i].id]; delete state.sc[sm[i].id]; }
    if(sm[i].id===id) hit = true;
  }
}
function toggleSel(id, d, isSuwon){
  var cur = state.sel[id];
  if(cur===d){
    delete state.sel[id]; delete state.sc[id];
    if(isSuwon) clearAfterSuwon(id);
  } else {
    var had = cur!==undefined;
    state.sel[id] = d;
    var sc = state.sc[id];
    if(sc && dig(sc[0],sc[1])!==d) delete state.sc[id];
    if(isSuwon && had) clearAfterSuwon(id);
  }
  delete state.err[id];
}
function readPair(box){
  var g = box.querySelector('input[data-k="g"]'), a = box.querySelector('input[data-k="a"]');
  return {g:g.value.trim(), a:a.value.trim()};
}
function validNum(s){ return /^\d{1,2}$/.test(s); }

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
  if(act==='selS'){ toggleSel(id, parseInt(b.getAttribute('data-d'),10), true); }
  else if(act==='selR'){ toggleSel(id, parseInt(b.getAttribute('data-d'),10), false); }
  else if(act==='reset'){ state.sel = {}; state.sc = {}; state.err = {}; }
  else if(act==='dock'){ state.dockOpen = !state.dockOpen; }
  save(); render();
});
document.addEventListener('change', function(e){
  var inp = e.target; if(!(inp instanceof HTMLInputElement)) return;
  var row = inp.closest('.srow'); if(!row) return;
  var id = row.getAttribute('data-sid'), p = readPair(row);
  if(p.g==='' && p.a===''){ delete state.sc[id]; delete state.err[id]; }
  else if(p.g!=='' && p.a!==''){
    if(!validNum(p.g) || !validNum(p.a)){ state.err[id] = '득점은 0~99 사이 숫자로 입력해 주세요.'; }
    else {
      var gf = parseInt(p.g,10), ga = parseInt(p.a,10);
      if(dig(gf,ga)!==state.sel[id]){ state.err[id] = '선택한 결과('+RES[state.sel[id]]+')와 스코어가 맞지 않아요.'; delete state.sc[id]; }
      else { state.sc[id] = [gf,ga]; delete state.err[id]; }
    }
  } else return;
  save(); render();
});

render();
window.__t = {evaluate:evaluate, magic:magic, state:state, teamStats:teamStats, agg:agg, render:render, GROUPS:GROUPS, curGroup:curGroup, byId:byId};
})();

</script>
